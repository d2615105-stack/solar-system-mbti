    // --- 성향 계산 알고리즘 ---
    function calculateResult(answers) {
      let scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
      
      answers.forEach(ans => {
        scores[ans]++;
      });

      const typeCode = [
        scores.E >= scores.I ? "E" : "I",
        scores.S >= scores.N ? "S" : "N",
        scores.T >= scores.F ? "T" : "F",
        scores.J >= scores.P ? "J" : "P"
      ].join("");

      let matchedPlanetKey = "EARTH";
      if (typeCode === "ISTP" || typeCode === "ESTP") matchedPlanetKey = "MERCURY";
      else if (typeCode === "ESFP" || typeCode === "ENFP") matchedPlanetKey = "VENUS";
      else if (typeCode === "ISFJ" || typeCode === "ESFJ") matchedPlanetKey = "EARTH";
      else if (typeCode === "ESTJ" || typeCode === "ENTP") matchedPlanetKey = "MARS";
      else if (typeCode === "ENFJ" || typeCode === "ENTJ") matchedPlanetKey = "JUPITER";
      else if (typeCode === "INFP" || typeCode === "ISFP") matchedPlanetKey = "SATURN";
      else if (typeCode === "INTP" || typeCode === "INTJ") matchedPlanetKey = "URANUS";
      else if (typeCode === "ISTJ" || typeCode === "INFJ") matchedPlanetKey = "NEPTUNE";

      return { planetKey: matchedPlanetKey };
    }

                      </div>
                      <div className="text-base font-bold text-white mb-1">
                        {planet.bestMatch.name}
                      </div>
                      <p className="text-xs text-slate-300 leading-relaxed">
                        {planet.bestMatch.reason}
                      </p>
                    </div>

                    <div className="bg-rose-950/30 border border-rose-500/30 rounded-2xl p-4">
                      <div className="text-xs font-bold text-rose-400 mb-1 flex items-center gap-1">
                        <span>⚡</span> 긴장감이 드는 행성
                      </div>
                      <div className="text-base font-bold text-white mb-1">
                        {planet.tensionMatch.name}
                      </div>
                      <p className="text-xs text-slate-300 leading-relaxed">
                        {planet.tensionMatch.reason}
                      </p>
                    </div>
                  </div>
                </div>

                {/* 내 행성의 과학적 특징 (오직 나의 행성 핵심 노트) */}
                <div className="glass-card rounded-3xl p-6 sm:p-8 space-y-4">
                  <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                    <div>
                      <span className="text-xs text-indigo-400 font-bold">중1 과학 7단원 핵심 노트</span>
                      <h3 className="text-lg sm:text-xl font-bold text-white">
                        [{planet.name}]의 과학적 특징
                      </h3>
                    </div>
                    <span className="text-3xl">{planet.icon}</span>
                  </div>

                  <ul className="space-y-3">
                    {planet.scienceFacts.map((fact, idx) => (
                      <li key={idx} className="flex items-start gap-3 bg-slate-900/60 p-4 rounded-xl border border-slate-800/80">
                        <span className="flex-shrink-0 w-6 h-6 rounded-full bg-indigo-500/20 text-indigo-400 text-xs font-bold flex items-center justify-center mt-0.5">
                          {idx + 1}
                        </span>
                        <span className="text-sm sm:text-base text-slate-200 leading-relaxed">
                          {fact}
                        </span>
                      </li>
                    ))}
                  </ul>
                </div>

                {/* 교실 탐구 미션 안내 */}
                <div className="bg-gradient-to-r from-indigo-900/40 via-purple-900/40 to-pink-900/40 border border-indigo-500/30 rounded-3xl p-6 text-center space-y-3">
                  <div className="text-2xl">🤝🧭</div>
                  <h4 className="text-base sm:text-lg font-bold text-white">
                    [클래스 탐구 미션] 다른 행성 친구를 찾아라!
                  </h4>
                  <p className="text-xs sm:text-sm text-slate-300 max-w-lg mx-auto leading-relaxed">
                    내 화면의 <strong>[{planet.name}]</strong> 특징을 확인했나요?<br/>
                    이제 교실을 돌아다니며 나 모르게 <u>나와 다른 행성이 나온 친구들</u>을 만나보세요! 친구들의 행성 카드를 보며 해당 행성의 특징을 활동지에 작성하며 탐구해봅시다.
                  </p>
                </div>

                {/* 재시작 버튼 */}
                <div className="pt-2 text-center">
                  <button
                    onClick={handleRestart}
                    className="px-8 py-3.5 rounded-2xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-sm border border-slate-700 transition"
                  >
                    🔄 검사 다시 받기
                  </button>
                </div>

              </div>
            );
          })()}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
